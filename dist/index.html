<body><title>Slope Calc</title><table id="table" border="1"><tr><th>X values</th><th>Y values</th></tr><tr><td contenteditable="true">X1 value</td><td contenteditable="true">X2 value</td></tr><tr><td contenteditable="true">Y1 value</td><td contenteditable="true">Y2 value</td></tr></table><button id="button">Calculate</button><h1 id="realanswer">y = mx + b</h1><style>body{background:rgb(0,203,249);color:rgb(0,30,255);font-family:system-ui,Avenir,Helvetica,Arial,sans-serif;display:flex;flex-direction:column;align-items:center}.table{margin:auto;text-align:center}button{background:rgb(0,30,255);text-align:center;font-family:system-ui,Avenir,Helvetica,Arial,sans-serif}</style><script>document.getElementById("button").onclick=()=>{const t=[];for(const e of table.rows){const n=Number(e.cells[0].textContent),l=Number(e.cells[1].textContent);isNaN(n)||isNaN(l)?document.getElementById("button").textContent="Please put in real numbers.":(t.push([n,l]),document.getElementById("button").textContent="Calculate"),t.length<2?document.getElementById("button").textContent="Please put in real numbers.":document.getElementById("button").textContent="Calculate";const o=table.rows[1],s=table.rows[2],u=Number(o.cells[0].textContent),a=Number(o.cells[1].textContent),m=Number(s.cells[0].textContent),c=(Number(s.cells[1].textContent)-a)/(m-u),d=a-c*u;isNaN(n)||isNaN(l)?document.getElementById("realanswer").textContent="Invalid":isNaN(c)||isNaN(d)?document.getElementById("realanswer").textContent="Invalid, might be undefined":document.getElementById("realanswer").textContent=`y = ${c}x + ${d}`}};</script></body>
